<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Random Hymn Tune</title>
  <style>
    :root{
      --panel-gap:8px;--panel-pad:8px;
      --gold:#FFC600;--gold-border:#d7a900;
      --gold-lite:#FFEFAD;--gold-lite-border:#E6D48A;--gold-lite-hover:#FFE68A;

      --btn-blue:#0a64dc;--btn-blue-hover:#084fb0;
      --btn-lightblue:#5ab6ff;--btn-lightblue-hover:#3fa8ff;
      --btn-red:#d32f2f;--btn-red-hover:#b71c1c;
      --btn-pink:#ff6fb3;--btn-pink-hover:#ff4fa3;

      /* green tuned to sit well with the gold palette */
      --btn-green:#2f7d55;
      --btn-green-hover:#256646;
    }

    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;padding:12px;background:#f7f7f9}
    #controlsBar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
    .control-group{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}

    button{
      color:#fff;border:none;border-radius:8px;
      padding:8px 12px;font-size:.95rem;cursor:pointer;
      transition:background-color 120ms ease,opacity 120ms ease
    }
    button[disabled]{opacity:.6;cursor:not-allowed}

    .btn-random{background:var(--btn-red)} .btn-random:hover{background:var(--btn-red-hover)}
    .btn-oct{background:var(--btn-pink)} .btn-oct:hover{background:var(--btn-pink-hover)}
    .btn-spacing{background:var(--btn-blue)} .btn-spacing:hover{background:var(--btn-blue-hover)}
    .btn-music{background:var(--btn-lightblue);color:#042a46} .btn-music:hover{background:var(--btn-lightblue-hover)}

    .btn-enharm{background:var(--btn-green);color:#fff}
    .btn-enharm:hover{background:var(--btn-green-hover)}

    .status-badge{
      padding:2px 8px;background:#fff;border:1px solid #ddd;border-radius:8px;
      font-weight:600;color:#333
    }

    #optionsBar{display:flex;align-items:flex-start;gap:var(--panel-gap);flex-wrap:wrap;margin-bottom:8px}
    .panel{background:#fff;border:1px solid #ddd;border-radius:8px;padding:var(--panel-pad);display:inline-flex;align-items:flex-start;gap:10px}
    .panel legend{font-weight:700;font-size:.9rem;margin-right:6px}
    #exPanel{flex-basis:100%}
    .row{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap}
    .panel-tools{display:inline-flex;gap:6px;margin-left:8px;vertical-align:middle}

    .tool-btn{
      padding:4px 8px;font-size:.82rem;border-radius:6px;
      background:var(--gold-lite);color:#3b2f00;border:1px solid var(--gold-lite-border);
      cursor:pointer
    }
    .tool-btn:hover{background:var(--gold-lite-hover)}
    .tool-btn:active{transform:translateY(.5px)}

    .chk-label{
      display:inline-flex;align-items:center;gap:6px;font-size:.95rem;
      padding:2px 6px;border-radius:6px;border:1px solid #ddd;background:#fff;
      transition:background-color 120ms ease,border-color 120ms ease
    }
    .chk-label input[type="checkbox"],.chk-label input[type="radio"]{
      appearance:none;width:14px;height:14px;border-radius:3px;border:1px solid #666;
      position:relative;margin-right:2px;background:#fff;
      transition:background-color 120ms ease,border-color 120ms ease,box-shadow 120ms ease
    }
    .chk-label input[type="checkbox"]::after,.chk-label input[type="radio"]::after{
      content:"";position:absolute;inset:3px;border-radius:2px;background:#333;opacity:0;transition:opacity 120ms ease
    }
    .chk-label input[type="checkbox"]:checked,.chk-label input[type="radio"]:checked{
      background:var(--gold);border-color:var(--gold-border);box-shadow:0 0 0 2px rgba(255,198,0,.25)
    }
    .chk-label input[type="checkbox"]:checked::after,.chk-label input[type="radio"]:checked::after{opacity:1}
    .chk-label span{padding:0 4px;border-radius:4px;border:1px solid transparent;color:#222;background:transparent}

    .key-range{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
    .key-range .range-btn{padding:4px 8px;font-size:.85rem;border-radius:6px;background:#666;color:#fff;border:1px solid transparent}
    .key-range .range-btn:hover{background:#444}
    .key-range .range-btn.active{background:var(--gold);color:#222;border:1px solid var(--gold-border)}

    #titleBar{
      background:#fff;border:1px solid #ddd;border-radius:8px;padding:6px 10px;
      font-weight:700;color:#333;margin:4px 0 8px;
      display:flex;align-items:center;gap:12px;flex-wrap:wrap
    }
    #titleBar .title-item{font-weight:700}
    #titleBar .title-item span.value{font-weight:600}
    #titleBar .divider{opacity:.35}

    .colPills{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
    .pill{
      display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid #ddd;
      background:#fff;color:#333;font-weight:600;font-size:.88rem;line-height:1.2;white-space:nowrap
    }
    .pill.active{background:var(--gold-lite);border-color:var(--gold-lite-border);color:#3b2f00}

    /* No horizontal scrollbar */
    #viewer{
      background:#fff;border:1px solid #ddd;border-radius:10px;padding:4px;min-height:200px;
      overflow-x:hidden; overflow-y:auto; overscroll-behavior-x:contain; margin-bottom:8px
    }

    /* IMPORTANT: do NOT force the inner SVG to width:100% (that cancels Music+) */
    #svg{width:100%;}
    #svg svg{display:block; height:auto; max-width:100%;}

    footer{margin-top:8px;color:#777;font-size:.85rem}
    #catalogLink{
      font-size:1rem;font-weight:700;text-decoration:none;color:var(--btn-blue);
    }
    #catalogLink:hover{ text-decoration:underline; }
  </style>
</head>
<body>
  <div id="controlsBar">
    <button id="randomBtn" class="btn-random" type="button" disabled>Show Random Tune</button>

    <span id="statusTune" class="status-badge">File: —</span>
    <span id="statusKey"  class="status-badge">Key: —</span>

    <button id="octUpBtn"   class="btn-oct" type="button" disabled title="Transpose up 8va">8va↑</button>
    <button id="octDownBtn" class="btn-oct" type="button" disabled title="Transpose down 8va">8va↓</button>

    <button id="enharmonicBtn" class="btn-enharm" type="button" disabled title="Toggle enharmonic spelling (C#/Db, D#/Eb, F#/Gb, G#/Ab, A#/Bb)">♯/♭</button>

    <button id="halfUpBtn" class="btn-music" type="button" disabled title="Transpose up a semitone">Half step ↑</button>
    <button id="halfDownBtn" class="btn-music" type="button" disabled title="Transpose down a semitone">Half step ↓</button>

    <div class="control-group" id="groupSpacing">
      <button id="spacingPlusBtn"  class="btn-spacing" type="button" disabled title="Increase spacing between notes">spacing+</button>
      <button id="spacingMinusBtn" class="btn-spacing" type="button" disabled title="Decrease spacing between notes">spacing−</button>
      <span id="spacingBadge" class="status-badge" title="Current spacing (linear / non-linear)">Spacing: —</span>
    </div>

    <div class="control-group" id="groupScale">
      <button id="musicPlusBtn"  class="btn-music" type="button" disabled title="Increase music size (auto-capped)">Music+</button>
      <button id="musicMinusBtn" class="btn-music" type="button" disabled title="Decrease music size">Music−</button>
      <span id="scaleBadge" class="status-badge" title="Current engraving scale">Scale: —</span>
    </div>
  </div>

  <div id="titleBar" aria-live="polite" title="">
    <div class="title-item">Title: <span class="value" id="titleValue">—</span></div>
    <div class="divider">|</div>
    <div class="title-item">
      Collections:
      <span class="value">
        <span id="collectionPills" class="colPills" aria-label="Collections for this tune"></span>
      </span>
    </div>
  </div>

  <div id="viewer"><div id="svg"></div></div>

  <div id="optionsBar">
    <fieldset class="panel" id="keysPanel">
      <legend>
        Key range
        <span class="panel-tools">
          <button class="tool-btn" type="button" id="keysAllBtn"  title="Select all key ranges">all</button>
          <button class="tool-btn" type="button" id="keysNoneBtn" title="Select no key ranges">none</button>
        </span>
      </legend>
      <div class="row key-range" id="keysRangeRow"></div>
    </fieldset>

    <fieldset class="panel" id="exPanel">
      <legend>
        Exclude
        <span class="panel-tools">
          <button class="tool-btn" type="button" id="exAllBtn"  title="Exclude all tonics">all</button>
          <button class="tool-btn" type="button" id="exNoneBtn" title="Exclude none">none</button>
        </span>
      </legend>
      <div class="row" id="exRow"></div>
    </fieldset>

    <fieldset class="panel" id="mmPanel">
      <legend>Major / Minor</legend>
      <div class="row" id="mmRow"></div>
    </fieldset>

    <fieldset class="panel" id="meterPanel">
      <legend>
        Meter
        <span class="panel-tools">
          <button class="tool-btn" type="button" id="meterAllBtn"  title="Select all meters">all</button>
          <button class="tool-btn" type="button" id="meterNoneBtn" title="Select none">none</button>
        </span>
      </legend>
      <div class="row" id="meterRow"></div>
    </fieldset>

    <fieldset class="panel" id="colPanel">
      <legend>
        Collection
        <span class="panel-tools">
          <button class="tool-btn" type="button" id="colAllBtn"  title="Select all collections">all</button>
          <button class="tool-btn" type="button" id="colNoneBtn" title="Select none">none</button>
        </span>
      </legend>
      <div class="row" id="colRow"></div>
    </fieldset>
  </div>

  <footer>
    <p style="margin:0">
      <a id="catalogLink" href="catalog.html">Tune Catalog — create custom “My Collection”</a>
    </p>
    <p style="margin-top:4px">created for the University of Iowa Organ Studio</p>
  </footer>

  <script>
    // ------------------------------
    // Local-only "My Collection" (shared with catalog.html)
    // ------------------------------
    const MY_LABEL = "My Collection";
    const MY_KEY = "tuneCatalog.myCollection.v1";

    function getMyCollectionSet(){
      try{
        const raw = localStorage.getItem(MY_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        return new Set(Array.isArray(arr) ? arr : []);
      }catch{
        return new Set();
      }
    }

    // ------------------------------
    // Config & state
    // ------------------------------
    let tuneFiles = [];
    const accidentalsSelected = new Set([0]);
    const labelFor = k => k.replace(/#/g,"♯").replace(/b/g,"♭");

    const majorMinorVals   = ["Major", "Minor"];
    const excludeTonics    = ["C","C#","Db","D","D#","Eb","E","F","F#","Gb","G","G#","Ab","A","A#","Bb","B","Cb"];

    let vrvToolkit = null;
    let currentFile = null;

    let currentTargetKey = "";
    let currentMode = ""; // "major" | "minor"
    let originalTonic = "";
    let octaveShift = 0;

    const ENHARMONIC_MAP = {
      "C#":"Db", "Db":"C#",
      "D#":"Eb", "Eb":"D#",
      "F#":"Gb", "Gb":"F#",
      "G#":"Ab", "Ab":"G#",
      "A#":"Bb", "Bb":"A#"
    };

    const originalMeiCache = {};   // filename -> MEI text
    const metadataCache    = {};   // filename -> parsed tags (with version)

    const MEI_NS = "http://www.music-encoding.org/ns/mei";
    const METADATA_CACHE_VERSION = 6;

    let currentTuneCollections = [];
    let currentTuneIsMine = false;

    // --- ENGRAVING OPTIONS ---
    const baseOptions = {
      scale: 44,

      pageWidth: 2200,
      pageHeight: 2000,
      adjustPageHeight: true,
      pageMarginLeft: 20,
      pageMarginRight: 20,
      pageMarginTop: 24,
      pageMarginBottom: 24,

      spacingSystem: 10,
      spacingStaff: 8,

      spacingLinear: 0.22,
      spacingNonLinear: 0.46,
      minMeasureWidth: 44,

      justifyVertically: false,
      breaks: "auto",

      spacingLyrics: 6
    };

    // ------------------------------
    // Bounds & steps + HARD CAP
    // ------------------------------
    const SCALE_MIN = 30;
    const SCALE_MAX = 200;
    const SCALE_STEP = 2;

    const SPACING_MIN = 0.08;
    const SPACING_MAX = 0.80;
    const SPACING_STEP = 0.01;

    // HARD CAP: max number of wrapped systems allowed on the page
    // (one melody line => "system" count behaves like your "wrap to another stave")
    const MAX_SYSTEMS = 3;

    function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }

    function debounce(fn, delay = 120) {
      let t = null;
      return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...args), delay);
      };
    }

    // Prevent overlapping renders from rapid clicking
    let renderBusy = false;

    // ------------------------------
    // Namespace-safe helpers
    // ------------------------------
    function nodelistToArray(nl) { return Array.prototype.slice.call(nl || []); }
    function allByTagNS(xml, tag) { return nodelistToArray(xml.getElementsByTagNameNS(MEI_NS, tag)); }
    function firstByTagNS(xml, tag) {
      const nl = xml.getElementsByTagNameNS(MEI_NS, tag);
      return nl && nl.length ? nl[0] : null;
    }

    // ------------------------------
    // UI helpers
    // ------------------------------
    function clearRow(containerId) {
      const row = document.getElementById(containerId);
      while (row.firstChild) row.removeChild(row.firstChild);
    }

    function setAllCheckboxes(containerId, checked) {
      document.querySelectorAll(`#${containerId} input[type="checkbox"]`).forEach(el => {
        if (!el.disabled) el.checked = !!checked;
      });
    }

    function addPlainCheckboxes(containerId, values, defaultChecked = true, labelTransform = null) {
      const row = document.getElementById(containerId);
      values.forEach(val => {
        const id = `${containerId}_${String(val).replace(/[^A-Za-z0-9]/g,'_')}`;
        const label = document.createElement('label');
        label.className = 'chk-label';
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.id = id; cb.value = val; cb.checked = defaultChecked;
        const span = document.createElement('span');
        span.textContent = labelTransform ? labelTransform(val) : val;
        label.appendChild(cb); label.appendChild(span);
        row.appendChild(label);
      });
    }

    function getChecked(containerId) {
      const out = [];
      document.querySelectorAll(`#${containerId} input[type="checkbox"], #${containerId} input[type="radio"]`)
        .forEach(el => { if (el.checked) out.push(el.value); });
      return out;
    }

    // ------------------------------
    // Collection pills status (CURRENT TUNE)
    // ------------------------------
    function getCheckedCollectionSetFromUI(){
      return new Set(
        Array.from(document.querySelectorAll('#colRow input[type="checkbox"]'))
          .filter(el => !el.disabled && el.checked)
          .map(el => String(el.value || "").trim())
          .filter(Boolean)
      );
    }

    function escapeHtml(s){
      return String(s)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function renderCurrentTuneCollectionPills(){
      const host = document.getElementById('collectionPills');
      if (!host) return;

      const checked = getCheckedCollectionSetFromUI();

      const set = new Set((currentTuneCollections || []).map(x => String(x || "").trim()).filter(Boolean));
      if (currentTuneIsMine) set.add(MY_LABEL);

      let list = Array.from(set);
      const alpha = (a,b) => a.localeCompare(b, undefined, { sensitivity:"base", numeric:true });
      list.sort(alpha);

      if (currentTuneIsMine && checked.has(MY_LABEL)) {
        list = [MY_LABEL, ...list.filter(x => x !== MY_LABEL)];
      }

      if (list.length === 0) {
        host.innerHTML = `<span class="pill">—</span>`;
        return;
      }

      host.innerHTML = list.map(name => {
        const active = checked.has(name) ? " active" : "";
        return `<span class="pill${active}">${escapeHtml(name)}</span>`;
      }).join("");
    }

    function wireCollectionStatusUpdates(){
      document.querySelectorAll('#colRow input[type="checkbox"]').forEach(el => {
        el.addEventListener('change', () => renderCurrentTuneCollectionPills());
      });
      renderCurrentTuneCollectionPills();
    }

    // ------------------------------
    // Key range buttons + select all/none
    // ------------------------------
    const keyRangeButtons = new Map(); // n -> button

    function addAccidentalRangeButtons(containerId) {
      const row = document.getElementById(containerId);
      for (let n = 0; n <= 7; n++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'range-btn' + (accidentalsSelected.has(n) ? ' active' : '');
        btn.textContent = `${n}#/${n}♭`;
        btn.title = `Include keys with exactly ${n} accidentals (sharp OR flat)`;
        btn.addEventListener('click', () => {
          if (accidentalsSelected.has(n)) { accidentalsSelected.delete(n); btn.classList.remove('active'); }
          else { accidentalsSelected.add(n); btn.classList.add('active'); }
        });
        row.appendChild(btn);
        keyRangeButtons.set(n, btn);
      }
    }

    function keyRangeSelectAll() {
      for (let n = 0; n <= 7; n++) accidentalsSelected.add(n);
      for (let n = 0; n <= 7; n++) keyRangeButtons.get(n)?.classList.add('active');
    }
    function keyRangeSelectNone() {
      accidentalsSelected.clear();
      for (let n = 0; n <= 7; n++) keyRangeButtons.get(n)?.classList.remove('active');
    }

    // ------------------------------
    // Exclude checkboxes
    // ------------------------------
    function addExcludeCheckboxes(containerId, values) {
      const row = document.getElementById(containerId);
      values.forEach(val => {
        const id = `${containerId}_${String(val).replace(/[^A-Za-z0-9]/g,'_')}`;
        const label = document.createElement('label');
        label.className = 'chk-label';
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.id = id; cb.value = val; cb.checked = false;
        const span = document.createElement('span'); span.textContent = labelFor(val);
        label.appendChild(cb); label.appendChild(span);
        row.appendChild(label);
      });
    }

    // ------------------------------
    // Status badges
    // ------------------------------
    function updateScaleBadge() {
      const badge = document.getElementById('scaleBadge');
      if (badge) badge.textContent = `Scale: ${baseOptions.scale}`;
    }
    function updateSpacingBadge() {
      const badge = document.getElementById('spacingBadge');
      if (badge) {
        const lin = baseOptions.spacingLinear.toFixed(2);
        const non = baseOptions.spacingNonLinear.toFixed(2);
        badge.textContent = `Spacing: ${lin} / ${non}`;
        badge.title = `Linear: ${lin}, Non-linear: ${non}`;
      }
    }

    function setMusicPlusEnabled(enabled, reason="") {
      const btn = document.getElementById('musicPlusBtn');
      if (!btn) return;
      btn.disabled = !enabled;
      btn.title = enabled
        ? "Increase music size (auto-capped)"
        : (reason || `Max size reached (cap: ${MAX_SYSTEMS} systems)`);
    }

    // ------------------------------
    // Controls
    // ------------------------------
    async function musicSizeChange(delta) {
      if (!currentFile || !vrvToolkit) return;
      if (renderBusy) return;
      renderBusy = true;

      try {
        const proposed = clamp(baseOptions.scale + delta, SCALE_MIN, SCALE_MAX);

        // If no change, just refresh enablement
        if (proposed === baseOptions.scale) {
          const info = await renderAtScale(baseOptions.scale, true);
          updateMusicCapButtons(info.systems);
          return;
        }

        // Preview: if it would exceed MAX_SYSTEMS, reject and hard-cap
        const preview = await renderAtScale(proposed, false);
        if (preview.systems > MAX_SYSTEMS) {
          // Hard cap reached: keep current scale, disable Music+
          setMusicPlusEnabled(false, `Max size reached (would exceed ${MAX_SYSTEMS} systems)`);
          return;
        }

        // Accept
        baseOptions.scale = proposed;
        const info = await renderAtScale(baseOptions.scale, true);
        updateMusicCapButtons(info.systems);

      } finally {
        renderBusy = false;
      }
    }

    function updateMusicCapButtons(systemCount) {
      // If we're already at the cap, disable plus. Otherwise enable (unless at SCALE_MAX).
      const canGrow = (systemCount < MAX_SYSTEMS) && (baseOptions.scale < SCALE_MAX);
      setMusicPlusEnabled(canGrow, `Max size reached (cap: ${MAX_SYSTEMS} systems)`);
      // Music- should always be available once toolkit is ready; we leave it enabled after init.
    }

    function spacingChange(delta) {
      const nextLinear     = clamp(baseOptions.spacingLinear     + delta, SPACING_MIN, SPACING_MAX);
      const nextNonLinear  = clamp(baseOptions.spacingNonLinear  + delta, SPACING_MIN, SPACING_MAX);
      if (nextLinear !== baseOptions.spacingLinear || nextNonLinear !== baseOptions.spacingNonLinear) {
        baseOptions.spacingLinear = nextLinear;
        baseOptions.spacingNonLinear = nextNonLinear;
        renderCurrent();
      }
      updateSpacingBadge();
    }

    // ------------------------------
    // MEI fetch
    // ------------------------------
    async function fetchMei(fileName) {
      if (!originalMeiCache[fileName]) {
        const res = await fetch(fileName, { cache: 'no-cache' });
        if (!res.ok) throw new Error(`Failed to fetch ${fileName}: ${res.status}`);
        originalMeiCache[fileName] = await res.text();
      }
      return originalMeiCache[fileName];
    }

    // ------------------------------
    // Comment metadata parser
    // ------------------------------
    function parseCommentMetadataFromXml(xmlDoc) {
      if (!xmlDoc || !xmlDoc.documentElement) return null;

      const meiRoot = firstByTagNS(xmlDoc, "mei") || xmlDoc.documentElement;
      const walker = xmlDoc.createTreeWalker(meiRoot, NodeFilter.SHOW_COMMENT, null);

      const lines = [];
      for (let n = walker.nextNode(); n; n = walker.nextNode()) {
        const text = (n.nodeValue || "").trim();
        if (!text) continue;
        text.split(/\r?\n/).forEach(line => {
          const s = line.trim();
          if (s) lines.push(s);
        });
      }
      if (lines.length === 0) return null;

      const md = { keyMode: "", keyTonic: "", meterSig: "", collection: "", collections: [], title: "" };
      for (const line of lines) {
        let mm = line.match(/^key\s*:\s*([A-Ga-g])([#bB])?\s+(major|minor)\s*$/i);
        if (mm) { md.keyTonic = mm[1].toUpperCase() + ((mm[2] || "").replace("B","b")); md.keyMode = mm[3].toLowerCase(); continue; }

        mm = line.match(/^keyTonic\s*:\s*([A-Ga-g])([#bB])?\s*$/i);
        if (mm) { md.keyTonic = mm[1].toUpperCase() + ((mm[2] || "").replace("B","b")); continue; }

        mm = line.match(/^keyMode\s*:\s*(major|minor)\s*$/i);
        if (mm) { md.keyMode = mm[1].toLowerCase(); continue; }

        mm = line.match(/^meterSig\s*:\s*(\d+)\s*\/\s*(\d+)\s*$/i);
        if (mm) { md.meterSig = `${mm[1]}/${mm[2]}`; continue; }

        mm = line.match(/^collection\s*:\s*(.+)$/i);
        if (mm) {
          const c = mm[1].trim();
          if (c) md.collections.push(c);
          if (!md.collection && c) md.collection = c;
          continue;
        }

        mm = line.match(/^title\s*:\s*(.+)$/i);
        if (mm) { md.title = mm[1].trim(); continue; }
      }

      const hasSomething = ["keyMode","keyTonic","meterSig","collection","title"].some(k => md[k]);
      return hasSomething ? md : null;
    }

    function meterSigFromXml(xml) {
      const meters = allByTagNS(xml, "meterSig");
      const mSig = meters.length ? meters[0] : null;
      const count = (mSig?.getAttribute("count") || "").trim();
      const unit  = (mSig?.getAttribute("unit")  || "").trim();
      if (count && unit) return `${count}/${unit}`;
      return "";
    }

    function collectionsFromXml(xml) {
      const identifiers = allByTagNS(xml, "identifier");
      return identifiers
        .filter(el => (el.getAttribute("type") || "").toLowerCase() === "collection")
        .map(el => (el.textContent || "").trim())
        .filter(Boolean);
    }

    async function getMetadata(fileName) {
      const cached = metadataCache[fileName];
      if (cached && cached.__v === METADATA_CACHE_VERSION) return cached;

      const meiText = await fetchMei(fileName);
      const xml = new DOMParser().parseFromString(meiText, "application/xml");

      const fromComments = parseCommentMetadataFromXml(xml);
      if (fromComments) {
        if (!fromComments.meterSig) fromComments.meterSig = meterSigFromXml(xml);

        if (!fromComments.collections || fromComments.collections.length === 0) {
          fromComments.collections = collectionsFromXml(xml);
          if (!fromComments.collection && fromComments.collections.length) {
            fromComments.collection = fromComments.collections[0];
          }
        }

        if (!fromComments.title) {
          const titleEl = firstByTagNS(xml, "title");
          fromComments.title = (titleEl?.textContent || "").trim();
        }

        const out = { ...fromComments, __v: METADATA_CACHE_VERSION };
        metadataCache[fileName] = out;
        return out;
      }

      const keys = allByTagNS(xml, "key");
      const keyEl = keys.length ? keys[0] : null;

      const keyMode  = (keyEl?.getAttribute("mode")  || "").trim();
      const pname    = (keyEl?.getAttribute("pname") || "").trim().toLowerCase();
      const accid    = (keyEl?.getAttribute("accid") || "").trim().toLowerCase();
      const keyTonic = pname ? (pname.toUpperCase() + (accid === "s" ? "#" : accid === "f" ? "b" : "")) : "";

      const collections = collectionsFromXml(xml);
      const collection  = collections.length ? collections[0] : "";

      const meterSig = meterSigFromXml(xml);

      const titleEl = firstByTagNS(xml, "title");
      const title = (titleEl?.textContent || "").trim();

      const out = { keyMode, keyTonic, collection, collections, meterSig, title, __v: METADATA_CACHE_VERSION };
      metadataCache[fileName] = out;
      return out;
    }

    async function buildCollectionsUIFromAllTunes() {
      clearRow("colRow");
      addPlainCheckboxes("colRow", [MY_LABEL], false);

      const set = new Set();
      for (const f of tuneFiles) {
        try {
          const md = await getMetadata(f);
          const cols = (md.collections && md.collections.length) ? md.collections : (md.collection ? [md.collection] : []);
          cols.forEach(c => set.add(c));
        } catch (e) {}
      }

      const list = Array.from(set).sort((a,b) => a.localeCompare(b, undefined, { sensitivity:"base", numeric:true }));
      if (list.length > 0) addPlainCheckboxes("colRow", list, true);

      wireCollectionStatusUpdates();
    }

    async function buildMetersUIFromAllTunes() {
      clearRow("meterRow");
      const set = new Set();
      for (const f of tuneFiles) {
        try {
          const md = await getMetadata(f);
          if (md.meterSig) set.add(md.meterSig);
        } catch (e) {}
      }

      const list = Array.from(set).sort((a,b) => {
        const am = a.match(/^(\d+)\/(\d+)$/);
        const bm = b.match(/^(\d+)\/(\d+)$/);
        if (am && bm) {
          const ac = Number(am[1]), au = Number(am[2]);
          const bc = Number(bm[1]), bu = Number(bm[2]);
          if (ac !== bc) return ac - bc;
          return au - bu;
        }
        return a.localeCompare(b, undefined, { sensitivity:"base", numeric:true });
      });

      if (list.length === 0) {
        addPlainCheckboxes("meterRow", ["(no meters found)"], true);
        const el = document.querySelector(`#meterRow input[type="checkbox"]`);
        if (el) el.disabled = true;
        return;
      }
      addPlainCheckboxes("meterRow", list, true);
    }

    // ------------------------------
    // Strip MEI title so it doesn't render in SVG
    // ------------------------------
    function stripMeiTitle(meiText) {
      try {
        const xml = new DOMParser().parseFromString(meiText, "application/xml");
        const titleStmts = allByTagNS(xml, "titleStmt");
        for (const ts of titleStmts) {
          if (ts && ts.parentNode) ts.parentNode.removeChild(ts);
        }
        return new XMLSerializer().serializeToString(xml);
      } catch (e) {
        console.warn("Failed to strip MEI title:", e);
        return meiText;
      }
    }

    // ------------------------------
    // SVG trim (whitespace removal)
    // ------------------------------
    function trimSvgWhitespace(svgHostId = "svg", pad = 12) {
      const host = document.getElementById(svgHostId);
      if (!host) return;

      const svg = host.querySelector("svg");
      if (!svg) return;

      if (!svg.getAttribute("viewBox")) {
        const w = parseFloat(svg.getAttribute("width") || "0") || 0;
        const h = parseFloat(svg.getAttribute("height") || "0") || 0;
        if (w > 0 && h > 0) svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
      }

      try {
        const box = svg.getBBox();
        const x = Math.max(0, box.x - pad);
        const y = Math.max(0, box.y - pad);
        const w = box.width + pad * 2;
        const h = box.height + pad * 2;

        svg.setAttribute("viewBox", `${x} ${y} ${w} ${h}`);
        svg.removeAttribute("height");
        svg.style.height = "auto";
      } catch (e) {}
    }

    // ------------------------------
    // Count systems in a rendered Verovio SVG
    // ------------------------------
    function countSystemsFromSvgText(svgText) {
      try {
        const doc = new DOMParser().parseFromString(svgText, "image/svg+xml");
        const byClass = doc.querySelectorAll(".system");
        if (byClass && byClass.length) return byClass.length;

        // Fallback: some versions use ids like system-*
        const byId = doc.querySelectorAll('[id^="system"], [id^="system-"], g[id*="system"]');
        if (byId && byId.length) return byId.length;

        return 1;
      } catch {
        return 1;
      }
    }

    // ------------------------------
    // Key database (NO normalization Cb->B; key sigs capped at 7)
    // ------------------------------
    const KEY_DB = {
      major: [
        { tonic:"C",  n:0, t:"none" },
        { tonic:"G",  n:1, t:"s" },
        { tonic:"D",  n:2, t:"s" },
        { tonic:"A",  n:3, t:"s" },
        { tonic:"E",  n:4, t:"s" },
        { tonic:"B",  n:5, t:"s" },
        { tonic:"F#", n:6, t:"s" },
        { tonic:"C#", n:7, t:"s" },

        { tonic:"F",  n:1, t:"f" },
        { tonic:"Bb", n:2, t:"f" },
        { tonic:"Eb", n:3, t:"f" },
        { tonic:"Ab", n:4, t:"f" },
        { tonic:"Db", n:5, t:"f" },
        { tonic:"Gb", n:6, t:"f" },
        { tonic:"Cb", n:7, t:"f" }
      ],
      minor: [
        { tonic:"A",  n:0, t:"none" },
        { tonic:"E",  n:1, t:"s" },
        { tonic:"B",  n:2, t:"s" },
        { tonic:"F#", n:3, t:"s" },
        { tonic:"C#", n:4, t:"s" },
        { tonic:"G#", n:5, t:"s" },
        { tonic:"D#", n:6, t:"s" },
        { tonic:"A#", n:7, t:"s" },

        { tonic:"D",  n:1, t:"f" },
        { tonic:"G",  n:2, t:"f" },
        { tonic:"C",  n:3, t:"f" },
        { tonic:"F",  n:4, t:"f" },
        { tonic:"Bb", n:5, t:"f" },
        { tonic:"Eb", n:6, t:"f" },
        { tonic:"Ab", n:7, t:"f" }
      ]
    };

    function keyInfo(tonic, mode){
      const m = (mode === "minor") ? "minor" : "major";
      return KEY_DB[m].find(k => k.tonic === tonic) || null;
    }

    function keySigString(tonic, mode){
      const info = keyInfo(tonic, mode);
      if (!info) return "";
      if (info.n === 0 || info.t === "none") return "";
      return `${info.n}${info.t === "s" ? "s" : "f"}`;
    }

    function relativeMajorForMinorTonic(minorTonic){
      const mi = keyInfo(minorTonic, "minor");
      if (!mi) return "C";
      const maj = KEY_DB.major.find(k => k.n === mi.n && k.t === mi.t);
      return maj ? maj.tonic : "C";
    }

    function tonicsByAccidentalsSelected(mode, selectedSet){
      const m = (mode === "minor") ? "minor" : "major";
      return KEY_DB[m].filter(k => selectedSet.has(k.n)).map(k => k.tonic);
    }

    const PC = {
      "C":0,"C#":1,"Db":1,"D":2,"D#":3,"Eb":3,"E":4,"F":5,"F#":6,"Gb":6,
      "G":7,"G#":8,"Ab":8,"A":9,"A#":10,"Bb":10,"B":11,"Cb":11
    };
    function mod12(x){ return ((x%12)+12)%12; }

    function candidatesForPC(pc, mode){
      const m = (mode === "minor") ? "minor" : "major";
      const want = mod12(pc);
      return KEY_DB[m].filter(k => PC[k.tonic] === want).map(k => k.tonic);
    }

    function preferSpellingFromCurrent(pc, mode, currentTonic){
      const cands = candidatesForPC(pc, mode);
      if (cands.length === 0) return (mode === "minor") ? "A" : "C";
      if (cands.length === 1) return cands[0];

      const wantsSharp = (currentTonic || "").includes("#");
      const wantsFlat  = (currentTonic || "").includes("b");
      if (wantsSharp) {
        const s = cands.find(x => x.includes("#"));
        if (s) return s;
      }
      if (wantsFlat) {
        const f = cands.find(x => x.includes("b"));
        if (f) return f;
      }
      return cands.find(x => x.includes("#")) || cands[0];
    }

    // ------------------------------
    // Apply starting key to MEI (for correct naturals)
    // ------------------------------
    function applyStartingKeyToMei(meiText, tonic, mode) {
      const sig = keySigString(tonic, mode);
      const m = (mode === "minor") ? "minor" : "major";

      const xml = new DOMParser().parseFromString(meiText, "application/xml");
      const targets = [...allByTagNS(xml, "scoreDef"), ...allByTagNS(xml, "staffDef")];
      targets.forEach(el => {
        if (el.hasAttribute("key.sig")) el.removeAttribute("key.sig");
        if (el.hasAttribute("keysig"))  el.removeAttribute("keysig");

        if (sig) {
          el.setAttribute("key.sig", sig);
          el.setAttribute("keysig",  sig);
        } else {
          el.setAttribute("keysig", "0");
        }

        el.setAttribute("key.mode", m);
      });

      return new XMLSerializer().serializeToString(xml);
    }

    // ------------------------------
    // Verovio transpose string
    // ------------------------------
    function tonicToVerovioTransposeTonic(tonic) {
      const m = String(tonic || "").match(/^([A-Ga-g])([#bB])?$/);
      if (!m) return "";
      const pname = m[1].toLowerCase();
      let acc = (m[2] || "");
      if (acc === "B") acc = "b";
      const accid = acc === "#" ? "s" : acc === "b" ? "f" : "";
      return pname + accid;
    }

    function computeTransposeOption() {
      if (!currentTargetKey) return "";

      const mode = (currentMode === "minor") ? "minor" : "major";
      const tonicForVerovio = (mode === "minor")
        ? relativeMajorForMinorTonic(currentTargetKey)
        : currentTargetKey;

      const tonicParam = tonicToVerovioTransposeTonic(tonicForVerovio);
      if (!tonicParam) return "";

      const prefix = octaveShift > 0 ? "+".repeat(octaveShift)
                   : octaveShift < 0 ? "-".repeat(-octaveShift)
                   : "";

      return prefix + tonicParam;
    }

    // ------------------------------
    // Infer original tonic from MEI keysig (fallback)
    // ------------------------------
    function readInitialKeySigFromXml(xml) {
      const scoreDefs = allByTagNS(xml, "scoreDef");
      const staffDefs = allByTagNS(xml, "staffDef");
      const first = scoreDefs[0] || staffDefs[0] || null;

      let sig = "";
      if (first) sig = first.getAttribute("keysig") || first.getAttribute("key.sig") || "";

      sig = (sig || "").trim();
      if (!sig || sig === "0") return { t: "none", n: 0 };

      const m = sig.match(/^(\d+)([sf])$/);
      if (!m) return { t: "none", n: 0 };
      return { t: m[2], n: Number(m[1]) };
    }

    function inferTonicFromKeySig(mode, t, n) {
      const m = (mode === "minor") ? "minor" : "major";
      if (n === 0) return (m === "minor") ? "A" : "C";
      const found = KEY_DB[m].find(k => k.n === n && k.t === t);
      return found ? found.tonic : ((m === "minor") ? "A" : "C");
    }

    // ------------------------------
    // Responsive page width
    // ------------------------------
  // Wider virtual page => fewer premature wraps at the default.
// Tune WRAP_BIAS if you want: 1.15 (more wrapping) ... 1.55 (less wrapping).
const WRAP_BIAS = 1.35;

function computeResponsivePageWidth() {
  const viewer = document.getElementById('viewer');
  const w = Math.max(320, viewer?.clientWidth || 0);

  // viewer has padding/border; subtract a little so we don't flirt with overflow
  const innerPad = 24;
  const effective = Math.max(260, w - innerPad);

  // Verovio's "pageWidth" is in its own units, but empirically:
  // a modest bias above the viewer width prevents early line breaks.
  return Math.max(700, Math.floor(effective * WRAP_BIAS));
}


    // ------------------------------
    // Rendering: render at a given scale (commit or preview)
    // ------------------------------
    async function renderAtScale(scaleValue, commitToDom) {
      if (!currentFile || !vrvToolkit) return { systems: 0, svg: "" };

      let meiData = await fetchMei(currentFile);
      meiData = stripMeiTitle(meiData);

      if (originalTonic) {
        meiData = applyStartingKeyToMei(meiData, originalTonic, currentMode);
      }

      const options = {
        ...baseOptions,
        scale: scaleValue,
        pageWidth: computeResponsivePageWidth(),
        transpose: computeTransposeOption()
      };

      vrvToolkit.setOptions(options);
      vrvToolkit.loadData(meiData);

      const svgText = vrvToolkit.renderToSVG(1, {});
      const systems = countSystemsFromSvgText(svgText);

      if (!commitToDom) {
        return { systems, svg: svgText };
      }

      document.getElementById('svg').innerHTML = svgText;
      trimSvgWhitespace("svg", 12);

      // update badges
      updateScaleBadge();
      updateSpacingBadge();

      const keyShown = currentTargetKey
        ? `${labelFor(currentTargetKey)} ${currentMode}`
        : (octaveShift ? (octaveShift > 0 ? "8va↑" : "8va↓") : "original");

      try {
        const md = await getMetadata(currentFile);
        const titleText = (md.title || "").trim();
        setStatus(currentFile, keyShown, titleText);

        const cols = (md.collections && md.collections.length) ? md.collections : (md.collection ? [md.collection] : []);
        currentTuneCollections = Array.from(new Set(cols.map(x => String(x || "").trim()).filter(Boolean)));

        currentTuneIsMine = getMyCollectionSet().has(currentFile);
        renderCurrentTuneCollectionPills();
      } catch (e) {
        setStatus(currentFile, keyShown, "");
        currentTuneCollections = [];
        currentTuneIsMine = getMyCollectionSet().has(currentFile);
        renderCurrentTuneCollectionPills();
      }

      return { systems, svg: svgText };
    }

    async function renderCurrent() {
      if (!currentFile || !vrvToolkit) return;
      if (renderBusy) return;
      renderBusy = true;
      try{
        const info = await renderAtScale(baseOptions.scale, true);
        updateMusicCapButtons(info.systems);
      } finally {
        renderBusy = false;
      }
    }

    function setStatus(fileName, keyShown, titleText = "") {
      const tuneName = (fileName && fileName !== "—") ? fileName.split('/').pop().replace(/\.mei$/i,'') : "—";
      const keyText  = keyShown && keyShown.trim ? keyShown : "—";
      const titleStr = (titleText && titleText.trim()) ? titleText.trim() : "—";

      document.getElementById('statusTune').textContent = `File: ${tuneName}`;
      document.getElementById('statusKey').textContent  = `Key: ${keyText}`;

      const titleValue = document.getElementById('titleValue');
      if (titleValue) titleValue.textContent = titleStr;

      const titleBar = document.getElementById('titleBar');
      if (titleBar) titleBar.title = `Title: ${titleStr}`;
    }

    // ------------------------------
    // Filtering & selection
    // ------------------------------
    async function pickRandomFilteredTune() {
      if (!tuneFiles || tuneFiles.length === 0) throw new Error("No tunes found.");

      const mmSelected    = getChecked('mmRow');
      const meterSelected = getChecked('meterRow');
      const colSelected   = getChecked('colRow');

      const mySet = getMyCollectionSet();
      const wantsMy = colSelected.includes(MY_LABEL);

      const candidates = [];
      for (const f of tuneFiles) {
        try {
          const md = await getMetadata(f);

          const mmTag = (md.keyMode?.toLowerCase() === "minor") ? "Minor" : "Major";
          const mmOk  = mmSelected.length === 0 ? true : mmSelected.includes(mmTag);

          const meterOk = meterSelected.length === 0
            ? true
            : (md.meterSig ? meterSelected.includes(md.meterSig) : false);

          const tuneCollections = (md.collections && md.collections.length) ? md.collections : (md.collection ? [md.collection] : []);
          const isMine = mySet.has(f);

          const colOk = colSelected.length === 0
            ? true
            : (
                (wantsMy && isMine) ||
                tuneCollections.some(c => colSelected.includes(c))
              );

          if (mmOk && meterOk && colOk) candidates.push(f);
        } catch (e) {
          console.warn("Skipping unreadable MEI:", f, e);
        }
      }

      if (candidates.length === 0) throw new Error("No tunes match the selected tag filters.");
      return candidates[Math.floor(Math.random() * candidates.length)];
    }

    async function showRandomTune() {
      if (renderBusy) return;
      renderBusy = true;
      try {
        currentFile = await pickRandomFilteredTune();

        const md = await getMetadata(currentFile);
        currentMode   = (md.keyMode?.toLowerCase() === "minor") ? "minor" : "major";
        originalTonic = md.keyTonic || "";

        if (!originalTonic) {
          const rawMei = await fetchMei(currentFile);
          const xml = new DOMParser().parseFromString(rawMei, "application/xml");
          const { t, n } = readInitialKeySigFromXml(xml);
          originalTonic = inferTonicFromKeySig(currentMode, t, n);
        }

        let allowedTonics = tonicsByAccidentalsSelected(currentMode, accidentalsSelected);
        const excluded = new Set(getChecked('exRow'));
        allowedTonics = allowedTonics.filter(T => !excluded.has(T));

        currentTargetKey = allowedTonics.length > 0
          ? allowedTonics[Math.floor(Math.random() * allowedTonics.length)]
          : "";

        octaveShift = 0;

        // render and then set cap buttons
        const info = await renderAtScale(baseOptions.scale, true);
        updateMusicCapButtons(info.systems);

      } catch (err) {
        console.error(err);
        setStatus("—", `Error: ${err.message}`, "");
        currentTuneCollections = [];
        currentTuneIsMine = false;
        renderCurrentTuneCollectionPills();
      } finally {
        renderBusy = false;
      }
    }

    async function octaveUp()   { octaveShift += 1; await renderCurrent(); }
    async function octaveDown() { octaveShift -= 1; await renderCurrent(); }

    async function halfStep(delta){
      if (!currentTargetKey) return;
      const pc = PC[currentTargetKey];
      if (typeof pc !== "number") return;

      const nextPc = mod12(pc + delta);
      const next = preferSpellingFromCurrent(nextPc, currentMode, currentTargetKey);

      currentTargetKey = next;
      await renderCurrent();
    }
    async function halfStepUp(){ await halfStep(+1); }
    async function halfStepDown(){ await halfStep(-1); }

    async function toggleEnharmonic(){
      if (!currentTargetKey) return;
      const pair = ENHARMONIC_MAP[currentTargetKey];
      if (!pair) return;

      currentTargetKey = pair;
      await renderCurrent();
    }

    // ------------------------------
    // Discover tunes
    // ------------------------------
    async function discoverTunes() {
      try {
        const res = await fetch(`tunes.json?_=${Date.now()}`, { cache: 'no-cache' });
        if (res.ok) {
          const arr = await res.json();
          const mei = (Array.isArray(arr) ? arr : [])
            .filter(x => typeof x === 'string')
            .map(x => x.split('#')[0].split('?')[0])
            .filter(x => /\.mei$/i.test(x))
            .map(x => x.replace(/^\.?\//,'').replace(/\\/g,'/'));
          if (mei.length > 0) {
            tuneFiles = Array.from(new Set(mei));
            console.log('Loaded tunes from manifest:', tuneFiles);
            return;
          }
        }
      } catch (e) { console.warn('Manifest fetch/parsing failed:', e); }

      try {
        const res = await fetch(`tunes/?_=${Date.now()}`, { cache: 'no-cache' });
        if (res.ok) {
          const html = await res.text();
          const tmp = document.createElement('div'); tmp.innerHTML = html;
          const hrefs = Array.from(tmp.querySelectorAll('a[href]')).map(a => a.getAttribute('href')).filter(Boolean);
          const paths = hrefs
            .map(h => h.split('#')[0].split('?')[0])
            .filter(h => /\.mei$/i.test(h))
            .map(h => (h.startsWith('tunes/') ? h : `tunes/${h.replace(/^\.?\//,'')}`));
          if (paths.length > 0) {
            tuneFiles = Array.from(new Set(paths));
            console.log('Discovered tunes from directory listing:', tuneFiles);
            return;
          }
        }
      } catch (e) { console.warn('Directory listing parse failed:', e); }

      tuneFiles = [];
      console.warn('No tunes found (manifest missing and directory listing empty).');
    }

    // ------------------------------
    // Verovio loader (JS/WASM)
    // ------------------------------
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src; s.async = true;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error(`Failed to load ${src}`));
        document.head.appendChild(s);
      });
    }

    // ------------------------------
    // Init
    // ------------------------------
    async function init() {
      addAccidentalRangeButtons("keysRangeRow");
      addExcludeCheckboxes("exRow", excludeTonics);
      addPlainCheckboxes("mmRow", majorMinorVals, true);

      await discoverTunes();
      if (!tuneFiles || tuneFiles.length === 0) setStatus("—", "No tunes found.", "");

      await buildCollectionsUIFromAllTunes();
      await buildMetersUIFromAllTunes();

      document.getElementById('keysAllBtn').addEventListener('click', keyRangeSelectAll);
      document.getElementById('keysNoneBtn').addEventListener('click', keyRangeSelectNone);

      document.getElementById('exAllBtn').addEventListener('click',   () => setAllCheckboxes('exRow', true));
      document.getElementById('exNoneBtn').addEventListener('click',  () => setAllCheckboxes('exRow', false));

      document.getElementById('meterAllBtn').addEventListener('click',  () => setAllCheckboxes('meterRow', true));
      document.getElementById('meterNoneBtn').addEventListener('click', () => setAllCheckboxes('meterRow', false));

      document.getElementById('colAllBtn').addEventListener('click',  () => { setAllCheckboxes('colRow', true); renderCurrentTuneCollectionPills(); });
      document.getElementById('colNoneBtn').addEventListener('click', () => { setAllCheckboxes('colRow', false); renderCurrentTuneCollectionPills(); });

      const verovioUrl = 'https://www.verovio.org/javascript/latest/verovio-toolkit-wasm.js?v=latest';
      try { await loadScript(verovioUrl); }
      catch (err) { console.error(err); setStatus("—", `Failed to load Verovio: ${err.message}`, ""); return; }

      const waitForGlobal = () => new Promise((resolve, reject) => {
        const start = performance.now(); const maxWaitMs = 10000;
        (function poll() {
          if (window.verovio && window.verovio.module) return resolve();
          if (performance.now() - start > maxWaitMs) return reject(new Error('Verovio global not found'));
          setTimeout(poll, 50);
        })();
      });

      try {
        await waitForGlobal();
        window.verovio.module.onRuntimeInitialized = () => {
          try {
            vrvToolkit = new verovio.toolkit();

            document.getElementById('randomBtn').disabled  = false;
            document.getElementById('octUpBtn').disabled   = false;
            document.getElementById('octDownBtn').disabled = false;

            document.getElementById('spacingPlusBtn').disabled  = false;
            document.getElementById('spacingMinusBtn').disabled = false;

            document.getElementById('musicPlusBtn').disabled  = false;
            document.getElementById('musicMinusBtn').disabled = false;

            document.getElementById('enharmonicBtn').disabled = false;
            document.getElementById('halfUpBtn').disabled = false;
            document.getElementById('halfDownBtn').disabled = false;

            document.getElementById('randomBtn').addEventListener('click', showRandomTune);
            document.getElementById('octUpBtn').addEventListener('click',  octaveUp);
            document.getElementById('octDownBtn').addEventListener('click', octaveDown);

            document.getElementById('halfUpBtn').addEventListener('click',  halfStepUp);
            document.getElementById('halfDownBtn').addEventListener('click', halfStepDown);

            document.getElementById('spacingPlusBtn').addEventListener('click', () => spacingChange(+SPACING_STEP));
            document.getElementById('spacingMinusBtn').addEventListener('click', () => spacingChange(-SPACING_STEP));

            // ASYNC scale changes with hard cap
            document.getElementById('musicPlusBtn').addEventListener('click', () => musicSizeChange(+SCALE_STEP));
            document.getElementById('musicMinusBtn').addEventListener('click', () => musicSizeChange(-SCALE_STEP));

            document.getElementById('enharmonicBtn').addEventListener('click', toggleEnharmonic);

            window.addEventListener('resize', debounce(() => renderCurrent(), 150));

            updateSpacingBadge();
            updateScaleBadge();

            currentTuneCollections = [];
            currentTuneIsMine = false;
            renderCurrentTuneCollectionPills();

            // Start with Music+ enabled; cap will adjust after first render
            setMusicPlusEnabled(true);

            if (tuneFiles.length > 0) showRandomTune();
          } catch (err) {
            console.error(err);
            setStatus("—", `Toolkit init error: ${err.message}`, "");
          }
        };
        setStatus("—", "Initializing Verovio…", "");
      } catch (err) {
        console.error(err);
        setStatus("—", `Verovio not available: ${err.message}`, "");
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
